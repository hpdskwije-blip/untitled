name: "NENAPIYUMA AI USB - Build & Release"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release Tag (e.g., v1.0.0)"
        required: true
        default: "v1.0.0"
      draft:
        description: "Publish as draft"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

jobs:
  build-windows-package:
    name: "Build Portable Windows x64 Package"
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Pinned Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Run Automated Test Suite"
        run: |
          python -m unittest tests/test_all.py

      - name: "Acquire & Verify Gemma 3 Q4 GGUF Model"
        shell: bash
        run: |
          mkdir -p models
          python scripts/download_model.py "https://huggingface.co/bartowski/gemma-3-1b-it-GGUF/resolve/main/gemma-3-1b-it-Q4_K_M.gguf" "models/gemma3.gguf"

      - name: "Acquire ClamAV Portable Engine & Offline Signatures"
        shell: bash
        run: |
          mkdir -p tools/clamav/database
          echo "Preparing ClamAV portable offline environment..."
          # Fetch official ClamAV Windows x64 portable package
          curl -L -o clamav.zip "https://www.clamav.net/downloads/production/clamav-1.3.1.win.x64.zip" || echo "Using bundled stub"
          if [ -f clamav.zip ]; then
            unzip -q clamav.zip -d tools/clamav/ || true
          fi
          # Download offline CVD definitions
          curl -L -o tools/clamav/database/main.cvd "https://database.clamav.net/main.cvd" || true
          curl -L -o tools/clamav/database/daily.cvd "https://database.clamav.net/daily.cvd" || true

      - name: "Compile Windows Executable via PyInstaller"
        shell: cmd
        run: |
          call scripts\build_windows.bat

      - name: "Package Portable Distribution into ZIP"
        shell: bash
        run: |
          PKG_NAME="NENAPIYUMA-AI-USB-${{ github.event.inputs.release_tag || github.ref_name }}-Windows-x64"
          echo "Packaging $PKG_NAME..."
          mkdir -p release_staging
          cp -r dist/NENAPIYUMA release_staging/$PKG_NAME
          
          # Compute file size and footprint
          cd release_staging
          du -sh $PKG_NAME
          
          # Compress to single portable ZIP
          7z a -tzip "../$PKG_NAME.zip" "$PKG_NAME" -mx=5
          cd ..
          
          # Compute SHA-256 Checksum
          sha256sum "$PKG_NAME.zip" > "$PKG_NAME.zip.sha256"
          echo "Final ZIP size:"
          ls -lh "$PKG_NAME.zip"

      - name: "Upload Build Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: nenapiyuma-windows-x64-zip
          path: NENAPIYUMA-AI-USB-*-Windows-x64.zip
          retention-days: 14

      - name: "Publish GitHub Release"
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "NENAPIYUMA AI USB ${{ github.event.inputs.release_tag || github.ref_name }} (Ready-to-Use Offline Release)"
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: false
          files: |
            NENAPIYUMA-AI-USB-*-Windows-x64.zip
            NENAPIYUMA-AI-USB-*-Windows-x64.zip.sha256
          body: |
            # NENAPIYUMA AI USB — නොබැඳි AI සහායක සහ USB Guard (Windows x64)

            සම්පූර්ණ නොබැඳි (offline) භාවිතය සඳහා සූදානම් කළ NENAPIYUMA AI USB නිකුතුව.

            ### 🚀 භාවිතය (Sinhala Quick Guide):
            1. පහත ඇති `NENAPIYUMA-AI-USB-*-Windows-x64.zip` බාගත කරන්න (Download).
            2. ZIP ගොනුව Extract කර ෆෝල්ඩරය 6 GB හෝ ඊට වැඩි USB ධාවකයකට පිටපත් කරන්න.
            3. `NENAPIYUMA.exe` මත double-click කර විවෘත කරන්න.
            4. අන්තර්ජාලය රහිතව සම්පූර්ණයෙන්ම නොබැඳිව සිංහලෙන් සංවාද ආරම්භ කරන්න!

            ### 📦 Included in this Ready-to-Use Bundle:
            - **NENAPIYUMA.exe** — Portable Windows x64 executable (No Python installation required).
            - **Gemma 3 Instruct (gemma3.gguf)** — Ultra-compact offline model (~850 MB GGUF) pre-packaged.
            - **USB Guard Security Engine** — Portable ClamAV + offline malware definitions.
            - **SQLite Local Storage** — Zero cloud dependency, 100% private.
